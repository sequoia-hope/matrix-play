pcb = "hw/parallelogram/p2-132/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p2-132/parallelogram.kicad_sch"
note = "100% routed & DRC-clean 4-layer high-density 6-column parallelogram (25 x 70 mm, 17.75 deg skew): 6 x 22 = 132 XL-1615RGBC-RF RGB LEDs (C965840, 1.6 x 1.5 mm, 3.70 x 2.60 mm = 8.5 LEDs/cm^2), 2x locally in-stock AW20198QNR QFN-40 drivers ($12.60/bd BOM, or $12.04 w/ RP2040), solid B.Cu exposed pads. Swapping XL-1010 -> XL-1615 opened a 0.80 mm intra-LED channel, closing the last 2 opens to 761/761 (100.0%, 0 open), 5,782 tracks, 670 vias (-22% vs XL-1010), 0 DRC errors/warnings, 0 copper_audit defects, 0 thin pad joints."

