# ---- Round Pendant Family (dia. 38 mm) ----

[[boards]]
id = "round-pendant-f"
name = "Round Pendant F (235 LEDs, track PDN)"
pcb = "hw/round-pendant/f/round-pendant.kicad_pcb"
sch = "hw/round-pendant/f/round-pendant.kicad_sch"
note = "Parent: round-pendant-e. Variant F: the 27 thin rectangular zones u3fix.py drew as RP2350 pin-to-decap links, DVDD fingers, LDO links and the FB finger are now locked 0.2 mm tracks (FB 0.12 mm through its neck), so escape vias can no longer carve them. FB is continuous from pin 50 to COUT again, VREG_VIN is fed from the 3V3 band. IOVDD pins 11 and 54 keep no direct link (no room beside their LED escape vias): C9 and C13 join through the In5 plane, as in E. 10 nets locally rerouted; 0 DRC errors/warnings, 0 unconnected, 0 copper_audit defects incl. new strip-zone/zone-intrusion checks (2 vendor-zone intrusions inherited from E)."

[[boards]]
id = "round-pendant-e"
name = "Round Pendant — Sunflower (WLCSP-36)"
pcb = "hw/round-pendant/e/round-pendant.kicad_pcb"
sch = "hw/round-pendant/e/round-pendant.kicad_sch"
note = "8-layer WLCSP-36 BGA sunflower architecture (Variant E): 235x XL-1010RGB LEDs on a golden-angle spiral, 5x IS31FL3745-CLS4-TR WLCSP-36 drivers (zero driver thermal pads blocking vias), solid U3/U5 GND pads, top-rim Everlight ALS-PT19 ambient light sensor, Voronoi seed-web front silk and 57 tidy back designators. 100% routed, 0 DRC errors/warnings. Superseded by Variant F: copper_audit's later strip-zone and zone-intrusion checks flag 34 defects here (27 thin pin-to-decap zones, 7 intrusions, including the FB finger cut in two), which F fixed with locked tracks."

[[boards]]
