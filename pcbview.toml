# pcbview.toml -- every board and variant the viewer builds.
#     scripts/view.sh build pcbview.toml
# Full option list: vendor/pcbview/README.md, "The config file".

title = "LED Matrix Geometry & Patterns"
subtitle = "RP2350 design-space exploration"
out = "viewer"
back = { href = "../index.html", label = "Overview" }
repo = "https://github.com/sequoia-hope/round-pendant"

# ---- Skewed Parallelogram 4-Layer Family (25 x 70 mm) ----

[[boards]]
id = "parallelogram-p1-66"
name = "Parallelogram p1-66 (66 LEDs, 4L)"
pcb = "hw/parallelogram/p1-66/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p1-66/parallelogram.kicad_sch"
note = "100% routed & DRC-clean lowest-cost 4-layer skewed parallelogram (25 x 70 mm, 17.75 deg skew): 6 x 11 = 66 XL-1615RGBC-RF RGB LEDs (C965840, 1.6 x 1.5 mm, 3.70 x 5.20 mm = 4.3 LEDs/cm^2), 1x locally in-stock AW20198QNR QFN-40 driver ($10.61/bd BOM, or $10.05 w/ RP2040), centered 20 x 35 mm prismatic LiPo pocket, peg-less EVQP7J01P side buttons, top-bezel XYC-PT19C-L1 sensor. 475/475 connections (0 open), 2,604 tracks, 343 vias (-27% vs XL-1010), 0 DRC errors/warnings, 0 copper_audit defects, 0 thin pad joints."

[[boards]]
id = "parallelogram-p2-132"
name = "Parallelogram p2-132 (132 LEDs, 4L)"
pcb = "hw/parallelogram/p2-132/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p2-132/parallelogram.kicad_sch"
note = "100% routed & DRC-clean 4-layer high-density 6-column parallelogram (25 x 70 mm, 17.75 deg skew): 6 x 22 = 132 XL-1615RGBC-RF RGB LEDs (C965840, 1.6 x 1.5 mm, 3.70 x 2.60 mm = 8.5 LEDs/cm^2), 2x locally in-stock AW20198QNR QFN-40 drivers ($12.60/bd BOM, or $12.04 w/ RP2040), solid B.Cu exposed pads. Swapping XL-1010 -> XL-1615 opened a 0.80 mm intra-LED channel, closing the last 2 opens to 761/761 (100.0%, 0 open), 5,782 tracks, 670 vias (-22% vs XL-1010), 0 DRC errors/warnings, 0 copper_audit defects, 0 thin pad joints."

[[boards]]
id = "parallelogram-p3-162"
name = "Parallelogram p3-162 (162 LEDs, 4L)"
pcb = "hw/parallelogram/p3-162/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p3-162/parallelogram.kicad_sch"
note = "Intermediate 3-driver 4-layer density tier: 9 x 18 = 162 RGB LEDs (2.55 x 3.15 mm = 10.5 LEDs/cm^2) on 25 x 70 mm skewed parallelogram, 3x AW20198QNR QFN-40 with solid exposed ground pads. Column pitch 2.55 mm < 3.40 mm QFN EP begins shadowing F.Cu columns: 870/901 connections routed (96.56%: 28 signal + 3 plane open), 6,289 tracks, 793 vias."

[[boards]]
id = "parallelogram-p3-198"
name = "Parallelogram p3-198 (198 LEDs, 4L)"
pcb = "hw/parallelogram/p3-198/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p3-198/parallelogram.kicad_sch"
note = "Full 3-driver 4-layer density tier: 9 x 22 = 198 RGB LEDs (2.55 x 2.60 mm = 12.8 LEDs/cm^2) on 25 x 70 mm skewed parallelogram, 3x AW20198QNR QFN-40 with solid exposed ground pads. 989/1,045 connections routed (94.64%: 56 signal open, 0 plane open), 7,117 tracks, 955 vias."

[[boards]]
id = "parallelogram-p4-264"
name = "Parallelogram p4-264 (264 LEDs, 4L)"
pcb = "hw/parallelogram/p4-264/parallelogram.kicad_pcb"
sch = "hw/parallelogram/p4-264/parallelogram.kicad_sch"
note = "4-driver 4-layer saturation tier: 12 x 22 = 264 RGB LEDs (2.02 x 2.60 mm = 17.0 LEDs/cm^2) on 25 x 70 mm skewed parallelogram, 4x AW20198QNR QFN-40 with solid exposed ground pads. 1,190/1,329 connections routed (89.54%: 139 signal open, 0 plane open), 7,945 tracks, 1,041 vias."

# ---- Sunflower Round Pendant Family (dia. 38 mm) ----

[[boards]]
id = "round-pendant-e"
name = "Round Pendant E (235 LEDs, WLCSP + ALS)"
pcb = "hw/round-pendant/e/round-pendant.kicad_pcb"
sch = "hw/round-pendant/e/round-pendant.kicad_sch"
note = "Variant E: adds front-side 12-o'clock top-rim Everlight ALS-PT19-315C/L177/TR8 ambient light sensor (Q2, GPIO1 switched collector + 22 k / 100 nF RC filter to ADC1) onto cleaned Variant D (5x IS31FL3745-CLS4-TR WLCSP-36 drivers, solid U3/U5 exposed pads, 8 layers, 0 DRC errors/warnings, 0 copper_audit defects)."

[[boards]]
id = "round-pendant-d"
name = "Round Pendant D (235 LEDs, WLCSP-36)"
pcb = "hw/round-pendant/d/round-pendant.kicad_pcb"
sch = "hw/round-pendant/d/round-pendant.kicad_sch"
note = "Variant D: 5x IS31FL3745-CLS4-TR WLCSP-36 BGA LED drivers (zero driver exposed pads), solid GND exposed pads on U3 and U5 with zero foreign vias, 8 layers, through vias, strict copper cleanup (0 DRC errors/warnings, 0 copper_audit defects), front seed web and 58 tidy back designators."

[[boards]]
id = "round-pendant-c-web4"
