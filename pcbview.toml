# pcbview.toml -- every board and variant the viewer builds.
#     scripts/view.sh build pcbview.toml
# Full option list: vendor/pcbview/README.md, "The config file".

title = "round-pendant"
subtitle = "235-LED round pendant"
out = "viewer"
back = { href = "../index.html", label = "Project page" }

[[boards]]
id = "round-pendant-c"
name = "round-pendant, variant C"
pcb = "hw/round-pendant/c/round-pendant.kicad_pcb"
sch = "hw/round-pendant/c/round-pendant.kicad_sch"
note = "From variant B: one extra LED at the centre on RP2350 GPIO23-25, 235 in all, nothing nudged. Driver-centred fan map. Not routed yet; routing attacks are running on copies."

[[boards]]
id = "round-pendant-a"
name = "round-pendant, variant A"
pcb = "hw/round-pendant/a/round-pendant.kicad_pcb"
sch = "hw/round-pendant/a/round-pendant.kicad_sch"
note = "First layout: 38 mm, six layers, 234 RGB LEDs top, all electronics bottom."

[[boards]]
id = "round-pendant-b"
name = "round-pendant, variant B"
pcb = "hw/round-pendant/b/round-pendant.kicad_pcb"
sch = "hw/round-pendant/b/round-pendant.kicad_sch"
note = "From variant A: sunflower LEDs, USB-C off the board through six pads, EVQP7C01P buttons with pegs between the LEDs."

[[boards]]
id = "round-pendant-c-web"
name = "round-pendant, y21 route with seed web silk"
pcb = "hw/round-pendant/c-web/round-pendant.kicad_pcb"
sch = "hw/round-pendant/c-web/round-pendant.kicad_sch"
note = "Earlier route with 2 +3V3 joins open. Front silk drawn as a web between the LEDs. Back silk removed."

[[boards]]
id = "round-pendant-c-web3"
name = "round-pendant, y30 route, no back silk"
pcb = "hw/round-pendant/c-web3/round-pendant.kicad_pcb"
sch = "hw/round-pendant/c-web3/round-pendant.kicad_sch"
note = "Route y30 with the seed web on the front and no silk on the back."

[[boards]]
id = "round-pendant-c-web4"
name = "round-pendant, 235 LEDs, fully connected, seed web and tidy designators"
pcb = "hw/round-pendant/c-web4/round-pendant.kicad_pcb"
sch = "hw/round-pendant/c-web4/round-pendant.kicad_sch"
note = "Work in progress: 8 layers, through vias, every connection joined, not signed off. Route y30, seed web on the front, 52 tidy designators on the back at 0.8 mm."

[[boards]]
id = "round-pendant-d"
name = "round-pendant, variant D (5x WLCSP-36 BGA drivers, solid exposed pads)"
pcb = "hw/round-pendant/d/round-pendant.kicad_pcb"
sch = "hw/round-pendant/d/round-pendant.kicad_sch"
note = "Variant D: 5x IS31FL3745-CLS4-TR WLCSP-36 BGA LED drivers (zero driver exposed pads), solid GND exposed pads on U3 and U5 with zero foreign vias, 8 layers, through vias, strict copper cleanup (0 DRC errors/warnings, 0 copper_audit defects), front seed web and 58 tidy back designators."

[[boards]]
id = "round-pendant-e"
embed = "index.html"
name = "round-pendant, variant E (top-rim ALS-PT19 light sensor + 5x WLCSP-36 BGA drivers)"
pcb = "hw/round-pendant/e/round-pendant.kicad_pcb"
sch = "hw/round-pendant/e/round-pendant.kicad_sch"
note = "Variant E: adds front-side 12-o'clock top-rim Everlight ALS-PT19-315C/L177/TR8 ambient light sensor (Q2, GPIO1 switched collector + 22 k / 100 nF RC filter to ADC1) onto cleaned Variant D (5x IS31FL3745-CLS4-TR WLCSP-36 drivers, solid U3/U5 exposed pads, 8 layers, 0 DRC errors/warnings, 0 copper_audit defects)."
