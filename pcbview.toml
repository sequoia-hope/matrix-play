note = "8-layer QFN-60 sunflower architecture (Variant C, route y30): 235x XL-1010RGB LEDs driven by 2x IS31FL3741A QFN-60 packages with tiled exposed ground pads around through-vias, Voronoi seed-web front silk, and 52 tidy back designators at 0.8 mm. Every connection joined."

[[boards]]
