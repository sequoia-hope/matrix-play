# pcbview.toml -- curated representative boards across each design type.
#     scripts/view.sh build pcbview.toml
# Full option list: vendor/pcbview/README.md, "The config file".

title = "Matrix Play"
subtitle = "RP2350 design-space exploration"
out = "viewer"
back = { href = "../index.html", label = "Overview" }
repo = "https://github.com/sequoia-hope/matrix-play"

